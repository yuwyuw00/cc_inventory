{% extends 'layout.html' %}
{% block content %}
<h2>Activity History</h2>
<table border="1" cellpadding="5">
  <tr>
    <th>Action</th>
    <th>Item</th>
    <th>User</th>
    <th>Timestamp</th>
  </tr>
  {% for log in logs %}
  <tr>
    <td>{{ log[0] }}</td>
    <td>{{ log[1] }}</td>
    <td>{{ log[3] }}</td>
    <td>{{ log[2] }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
