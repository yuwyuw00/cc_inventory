{% extends 'layout.html' %}
{% block content %}
<h2>Account Settings</h2>
<form method="POST">
  <input type="text" name="username" value="{{ user[0] }}" required><br>
  <input type="email" name="email" value="{{ user[1] }}" required><br>
  <input type="password" name="password" placeholder="New Password" required><br>
  <button type="submit">Update Account</button>
</form>
{% endblock %}
